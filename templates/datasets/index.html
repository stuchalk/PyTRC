{% extends 'base.html' %}
{% block title %} Datasets Index {% endblock %}
{% block header %} Datasets Index {% endblock %}
{% block content %}
    <div class="row">
        <div class="col-8 offset-1">
            <h3>Datasets by Experimental Quantity</h3>
        </div>
        <div class="col-2">
            <label for="listsrc" hidden=""></label>
            <input id="listsrc" placeholder="Search datasets..." class="form-control pull-right" data-search-override="true" type="text"/>
        </div>
    </div>
    <div class="row">
        <div class="col-10 offset-1">
            <div class="accordion" id="subaccordion">
                {% for qnt, reflist in sets.items %}
                    <div class="accordion-item sections">
                        <h2 class="accordion-header" id="heading{{ forloop.counter }}" data-sort="{{ qnt }}">
                            <button class="accordion-button bg-light p-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}" aria-expanded="true" aria-controls="collapse{{ forloop.counter }}">
                                <strong>{{ qnt }} (<span class="cnt">{{ reflist|length}}</span> papers)</strong>
                            </button>
                        </h2>
                        <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse{% if forloop.counter == 1 %} show{% endif %}" aria-labelledby="heading{{ forloop.counter }}" data-bs-parent="#subaccordion">
                            <div class="accordion-body list-group listgrp-flush p-0">
                                {% for ref in reflist %}
                                    <a href="{% url 'reference view' ref.id %}" class="list-group-item list-group-item-small item" data-content="{{ ref.title|lower }}">{{ ref.title }}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
